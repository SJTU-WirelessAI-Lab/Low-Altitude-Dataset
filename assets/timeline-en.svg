<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="Cumulative low-altitude datasets, 2015 to 2026: the total grows from 0 to 64, of which 10 provide full CSI">
<title>Cumulative low-altitude datasets (2015–2026)</title>
<desc>Solid blue line: cumulative count of all low-altitude datasets, reaching 64 by the end of 2026. Dashed teal line: the subset providing full MIMO channel CSI, 10. Source data carries publication year only, so points fall at year ends.</desc>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
  .bg { fill: #ffffff; }
  .ttl { fill: #1f2328; font-size: 15px; font-weight: 500; }
  .sub { fill: #57606a; font-size: 12px; }
  .tick { fill: #57606a; font-size: 11px; }
  .grid { stroke: rgba(31,35,40,0.09); stroke-width: 1; }
  .axis { stroke: rgba(31,35,40,0.25); stroke-width: 1; }
  .area { fill: rgba(63,138,219,0.11); }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ttl { fill: #e6edf3; }
    .sub, .tick { fill: #8b949e; }
    .grid { stroke: rgba(230,237,243,0.13); }
    .axis { stroke: rgba(230,237,243,0.30); }
    .area { fill: rgba(88,166,255,0.15); }
  }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="2015 至 2026 年低空索引条目累计数量：全部由 0 增至 57 个，其中含完整 CSI 的为 11 个">
<title>低空索引条目累计数量（2015–2026）</title>
<desc>蓝色实线为全部低空相关索引条目的累计数量，至 2026 年累计 57 个；青色虚线为其中提供完整 MIMO 信道 CSI 的条目，为 11 个。源数据仅有出版年，按出版年分组累计。</desc>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
